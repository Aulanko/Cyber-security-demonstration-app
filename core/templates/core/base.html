<!doctype html>
<html>
<body>
<nav>
  {% if user.is_authenticated %}
    <a href="{% url 'note_list' %}">My notes</a> |
    <a href="{% url 'note_create' %}">New note</a> |
    <form action="{% url 'logout' %}" method="post" style="display:inline">
      {% csrf_token %}<button>Log out ({{ user.username }})</button>
    </form>
  {% else %}
    <a href="{% url 'login' %}">Log in</a> | <a href="{% url 'register' %}">Register</a>
  {% endif %}
</nav>
<hr>
{% block content %}{% endblock %}
</body>
</html>
